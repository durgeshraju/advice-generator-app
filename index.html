<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advice Card</title>

  <!-- Google Font: Manrope -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet" preconnect>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">  
</head>

<body>

  <!-- Main container centers content vertically and horizontally -->
  <main class="container">

    <!-- Advice Card -->
    <article class="advice-card">

      <!-- Advice ID -->
      <p class="advice-id">
        Advice # <span id="advice-id-number">117</span>
      </p>

      <!-- Quote -->
      <blockquote class="advice-text">
        “It is easy to sit up and take notice, what's difficult is getting up and taking action.”
      </blockquote>

      <!-- Divider -->
      <div class="divider">
        <img src="images/pattern-divider-desktop.svg" alt="divider">
      </div>

      <!-- Dice Button -->
      <button class="dice-button" aria-label="Generate advice">
        <img src="images/icon-dice.svg" alt="">
      </button>

    </article>

  </main>
<script src="scripts/main.js" type="module" defer></script>
</body>
</html>
